name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    # DỰNG SẴN POSTGRES VÀ REDIS TRÊN RUNNER ĐỂ SPRING BOOT KẾT NỐI KHI TEST
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: concert_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw || true
          chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test -B
        env:
          # Dummy values để Spring Boot context load được StripeConfig khi test
          STRIPE_API_KEY: sk_test_dummy_for_ci
          STRIPE_SECRET_KEY: sk_test_dummy_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
          JWT_SECRET: this-is-a-dev-only-secret-key-change-in-production-min-32-chars

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t concert-booking-platform:${{ github.sha }} .