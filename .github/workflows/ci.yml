name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cấp quyền để dorny/test-reporter ghi báo cáo vào tab Checks của GitHub
permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw || true
          chmod +x mvnw

      - name: Verify Docker is available
        run: docker info

      - name: Run tests
        run: ./mvnw clean test -B
        env:
          # Dummy values để Spring Boot context load được StripeConfig khi test
          STRIPE_API_KEY: sk_test_dummy_for_ci
          STRIPE_SECRET_KEY: sk_test_dummy_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
          JWT_SECRET: this-is-a-dev-only-secret-key-change-in-production-min-32-chars

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/